name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions minutes are free on a public repository and metered on a private one, where the
# maintainer runs the same checks locally: every job skips while the repository is private.
jobs:
  # Each platform's checks run as parallel parts, so a PR waits for the longest part, not their
  # sum: "test" (the fast tests, lint, the synthetic golden; its name is the required check's),
  # "end-to-end" (the tests marked slow: whole builds and CLI runs) and, on three platforms,
  # "build variants" (the golden's other builds). Coverage is measured on both 3.12 test parts
  # and combined below.
  test:
    name: ${{ matrix.part == 'fast' && 'test' || matrix.part }} (${{ matrix.os }}, ${{ matrix.python-version }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # no process writes bytecode into the venv or the checkout while the tests run (the venv is
    # precompiled below) and no user site-packages leaks in: a child Python on a macOS runner
    # sometimes saw an incomplete set of installed packages (tests/childproc.py)
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    # Windows isn't supported yet (paths in fourier.toml, rsync, SQLite file locks): its run
    # is by hand, in windows.yml, until it passes
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: fast, os: ubuntu-latest, python-version: "3.11"}
          - {part: fast, os: ubuntu-latest, python-version: "3.12", coverage: true}
          - {part: fast, os: ubuntu-latest, python-version: "3.13"}
          - {part: fast, os: ubuntu-latest, python-version: "3.14"}
          - {part: fast, os: macos-latest, python-version: "3.12"}
          - {part: fast, os: macos-latest, python-version: "3.14"}
          - {part: end-to-end, os: ubuntu-latest, python-version: "3.11"}
          - {part: end-to-end, os: ubuntu-latest, python-version: "3.12", coverage: true}
          - {part: end-to-end, os: ubuntu-latest, python-version: "3.13"}
          - {part: end-to-end, os: ubuntu-latest, python-version: "3.14"}
          - {part: end-to-end, os: macos-latest, python-version: "3.12"}
          - {part: end-to-end, os: macos-latest, python-version: "3.14"}
          # the variants test the pipeline, not the Python version: three platforms run them
          - {part: build variants, os: ubuntu-latest, python-version: "3.11"}
          - {part: build variants, os: ubuntu-latest, python-version: "3.12"}
          - {part: build variants, os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # the versions in uv.lock: the synthetic golden's audio holds only for these
      # (CLAP and torch left out: the tests use a stand-in)
      - name: Install (locked versions; core + dev)
        shell: bash
        run: |
          # a venv first, on PATH for every later step: the tests' subprocesses then find the same
          # packages as pytest (on a macOS runner a child of the runner's Python once didn't)
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --no-emit-project > "$RUNNER_TEMP/requirements.lock.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.lock.txt"
          python -m pip install -e . --no-deps
      - name: Precompile the venv and the checkout
        shell: bash
        # a package may ship a file that doesn't compile (an old example, a template): a warning
        run: python -m compileall -q -j 0 "$RUNNER_TEMP/venv" src tests || echo "::warning::compileall left some files uncompiled"
      - name: The venv is the Python every step uses, and its children's
        shell: bash
        run: |
          python -c "import sys; print(sys.executable)"
          # a child started as the tests start one (subprocess, sys.executable) runs in the venv too
          python - <<'EOF'
          import os, subprocess, sys
          code = ("import os, sys, click, fourier; "
                  "venv = os.path.realpath(os.path.join(os.environ['RUNNER_TEMP'], 'venv')); "
                  "assert os.path.realpath(sys.prefix) == venv != os.path.realpath(sys.base_prefix), "
                  "(sys.prefix, sys.base_prefix, venv); print(sys.executable, sys.prefix)")
          exec(code)
          subprocess.run([sys.executable, "-c", code], check=True)
          EOF
      - name: Lint
        if: ${{ matrix.part == 'fast' }}
        run: ruff check src tests
      - name: Tests
        if: ${{ matrix.part != 'build variants' && !matrix.coverage }}
        shell: bash
        # one worker per CPU (pytest-xdist; conftest.py isolates each)
        run: pytest -q -n auto -m "${{ matrix.part == 'fast' && 'not slow' || 'slow' }}" tests
      - name: Tests, with coverage
        if: ${{ matrix.part != 'build variants' && matrix.coverage }}
        shell: bash
        run: |
          pytest -q -n auto -m "${{ matrix.part == 'fast' && 'not slow' || 'slow' }}" --cov --cov-report= tests
          mv .coverage "coverage-${{ matrix.part }}.data"
      - name: Keep the coverage data for the combined report
        if: ${{ matrix.part != 'build variants' && matrix.coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.part }}
          path: coverage-${{ matrix.part }}.data
          include-hidden-files: true
          retention-days: 3
      - name: Synthetic golden build
        if: ${{ matrix.part == 'fast' }}
        shell: bash
        run: python tests/golden/synthetic_build.py "$RUNNER_TEMP/synthetic" --check
      - name: Without Sononym, without Live, without both
        if: ${{ matrix.part == 'build variants' }}
        shell: bash
        run: |
          python tests/golden/synthetic_build.py "$RUNNER_TEMP/no-sononym" --without sononym
          python tests/golden/synthetic_build.py "$RUNNER_TEMP/no-live" --without ableton
          python tests/golden/synthetic_build.py "$RUNNER_TEMP/neither" --without sononym,ableton
      - name: Two presets (breaks-acid and balanced) build and pass verify
        if: ${{ matrix.part == 'build variants' }}
        shell: bash
        run: |
          python tests/golden/synthetic_build.py "$RUNNER_TEMP/breaks-acid" --preset breaks-acid
          python tests/golden/synthetic_build.py "$RUNNER_TEMP/balanced" --preset balanced
      - name: A small library's master scales to it
        if: ${{ matrix.part == 'build variants' }}
        shell: bash
        run: python tests/golden/synthetic_build.py "$RUNNER_TEMP/scaled" --scale --preset balanced
      - name: An interrupted build resumes to the same result
        if: ${{ matrix.part == 'build variants' }}
        shell: bash
        run: python tests/golden/synthetic_build.py "$RUNNER_TEMP/resume" --check --interrupt KICKS,PADS,VOX

  coverage:
    # the two 3.12 test parts' data, combined: the floor holds for the whole suite as before
    name: coverage (ubuntu-latest, 3.12)
    if: ${{ !github.event.repository.private }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install coverage (the locked version)
        shell: bash
        run: |
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --no-emit-project | grep -iE '^coverage==' > "$RUNNER_TEMP/cov.txt"
          python -m pip install -r "$RUNNER_TEMP/cov.txt"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        shell: bash
        run: |
          mv coverage-fast.data .coverage.fast && mv coverage-end-to-end.data .coverage.end-to-end
          coverage combine .coverage.fast .coverage.end-to-end
          coverage xml
          # 87% when this began (2026-10-04): the floor stops a drop, raise it as it climbs
          coverage report --fail-under=85
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck (mypy)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the same venv as the test job's
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (locked versions; core + dev)
        shell: bash
        run: |
          # a venv first, on PATH for every later step: the tests' subprocesses then find the same
          # packages as pytest (on a macOS runner a child of the runner's Python once didn't)
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          . "$RUNNER_TEMP/venv/bin/activate"
          python -m pip install --upgrade pip uv
          uv export --frozen --no-hashes --extra dev --no-emit-project > "$RUNNER_TEMP/requirements.lock.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.lock.txt"
          python -m pip install -e . --no-deps
      - name: The venv is the Python every step uses, and its children's
        shell: bash
        run: |
          python -c "import sys; print(sys.executable)"
          # a child started as the tests start one (subprocess, sys.executable) runs in the venv too
          python - <<'EOF'
          import os, subprocess, sys
          code = ("import os, sys, click, fourier; "
                  "venv = os.path.realpath(os.path.join(os.environ['RUNNER_TEMP'], 'venv')); "
                  "assert os.path.realpath(sys.prefix) == venv != os.path.realpath(sys.base_prefix), "
                  "(sys.prefix, sys.base_prefix, venv); print(sys.executable, sys.prefix)")
          exec(code)
          subprocess.run([sys.executable, "-c", code], check=True)
          EOF
      - name: mypy (settings in pyproject.toml)
        run: mypy

  package:
    # what `pip install` gives a user: the sdist and wheel build, their metadata passes twine,
    # and the wheel installed with its declared dependencies (no checkout, no [clap]) runs
    name: package (build, install, run)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip uv
          uv build
          ls -l dist
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      - name: Check what the wheel holds
        run: |
          python -m zipfile -l dist/*.whl > "$RUNNER_TEMP/wheel.txt"
          for f in fourier/__main__.py fourier/demo.py fourier/_config/tunables.yaml \
                   fourier/_config/devices/m8_tracker.yaml licenses/LICENSE licenses/NOTICE; do
            grep -q "$f" "$RUNNER_TEMP/wheel.txt" || { echo "missing from the wheel: $f"; exit 1; }
          done
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: Run the installed command
        working-directory: ${{ runner.temp }}     # away from the checkout's src/ and config/
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH" FOURIER_HOME="$RUNNER_TEMP/home"
          fourier --version
          python -m fourier --help
          fourier devices list
          # no library and no database here, so doctor reports FAILs and exits non-zero:
          # it only has to run to the end
          fourier doctor > doctor.txt 2>&1 || true
          cat doctor.txt
          if grep -q Traceback doctor.txt; then exit 1; fi
          fourier demo --dir "$RUNNER_TEMP/demo"
