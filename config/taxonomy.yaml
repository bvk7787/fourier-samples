# The taxonomy: which folders a build makes and what goes in each (docs/design-history.md,
# "How it became configurable"). A style (a preset) decides how much of each and which files; this file decides what
# the folders are. The code reads it once (src/fourier/taxonomy.py) into the tunables it has
# always had (CATEGORY_ORDER, KICK_PHRASES, KIT_CATS, ...), so [advanced] overrides by those
# names still work. `fourier config explain categories` prints it with example files.
#
# CLAP prompts are compared as text: changing one misses the clap_text cache and moves picks,
# so edit them on purpose. A {library: NAME} prompt entry is where a library overlay's own
# prompts go (the library-class tunable NAME, empty by default; fourier/taxonomy.py prompts()).
# A library overlay can also add whole categories of its own (add_categories; docs/curation.md,
# "Adding a category"): they are numbered after these.

# folder order: a category's position is its folder number (01_KICKS, 02_SNARES, ...)
order: [KICKS, SNARES, CLAPS, HATS, CYMBALS, TOMS, PERC, DRUMLOOPS, PHRASES, SUB, SYNTH, STABS, PADS,
  PIANO, ACOUSTIC, WAVES, FX, BLIPS, VOX]
# the derived sets, numbered 00 so they sit above the categories
sets: {KITS: 00_KITS, SLICE: 00_SLICE}
# where special files go: musical loops, single-cycle waves, named scratches, chords on keys
homes: {phrases: PHRASES, waves: WAVES, scratches: FX, key_chords: null}
# one-shots with these labels may be single-note keys for PIANO
piano_pool_labels: [lead, bass, blip, stab]
# categories that were merged into others: ratings on them follow
renamed: {BELLS: ACOUSTIC, ORCHESTRAL: ACOUSTIC, MALLETS: ACOUSTIC, SCRATCHES: FX}
# band folders within a category, in folder order (PHRASES' bands are its roles, below)
bands:
  wave: [cycle, table]
  chord: [note, chord]
  hat: [closed, open]
  cymbal: [ride, crash, cymbal]
  fx: [impact, whoosh, riser, downlifter, sweep, noise, ambience, foley, synth, scratch, misc]
  loop: [classic, full, tops]
  acoustic: [string, wind, plucked, mallet]
# PHRASES' roles (acid lines, basslines, chords, leads, live playing)
phrase_roles: [acid, bass, chords, lead, live]

# Each category: kind (oneshot, loop, gated, instrument, waves), the canonical labels that
# make a file a candidate (metadata/vocab.py; none: chosen by other rules), the noun its
# folders leave out, roles (kit: 00_KITS draws from it; melodic / tonal: notes and retuning;
# note_lead: folders named by note; no_sets: left out of the together-sets), and its CLAP
