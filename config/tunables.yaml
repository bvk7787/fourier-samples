# Every module-level tunable in the curation code, classed by who decides it
# (docs/design-history.md; fourier/knobs.py for the knobs). One line per tunable:
#   <module>.<NAME>: <class>[:<knob that sets it>]
# scripts/tunables_inventory.py joins this with the live values into a CSV, and
# tests/test_tunables_inventory.py fails when a tunable is added or removed without a line here.
#
# Classes:
#   correctness  audio safety and measurement accuracy; always on, advanced-only, "leave alone"
#   knob         the mechanism behind a knob (loudness, retune, stereo, tempo, fold, size,
#                scale, sources, names, categories, vendors, words, sets); advanced can still override it
#   taste        what a style preset decides (budgets, prompts, naming dimensions, kit recipe)
#   rules        generic routing vocabulary: becomes the path rule provider's data
#   engine       algorithm parameters (clustering, similarity, routing shares, stability)
#   taxonomy     which categories exist and how they relate: taxonomy.yaml
#   vendor       Sononym or Ableton vocabulary: provider mapping files
#   library      rules that only match one person's packs: their private overlay
#   device       a device limit: the device profile
#   internal     derived from other values; not a setting



